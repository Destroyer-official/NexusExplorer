[package]
name = "nexus-explorer"
version.workspace = true
edition.workspace = true
description = "Nexus Explorer — the fastest, most reliable file explorer for Windows"
license.workspace = true

[lib]
name = "nexus_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexus-core = { path = "../crates/nexus-core" }
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util"] }
notify = "8.2"
notify-debouncer-full = "0.7"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
