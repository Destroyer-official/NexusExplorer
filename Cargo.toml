[workspace]
resolver = "2"
members = ["crates/nexus-core", "crates/nexus-cli", "src-tauri", "nexus_engine_ffi"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
codegen-units = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
